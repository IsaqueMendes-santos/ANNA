<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="theme-color" content="#0a1628">
<title>Quando você precisar de mim 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --azul-escuro:#0a1628;
    --azul-medio:#132a52;
    --azul-profundo:#060e1c;
    --azul-claro:#7ab8ff;
    --azul-brilho:#4d9fff;
    --ciano:#7dd3fc;
    --azul-suave:#c7deff;
    --branco-azulado:#eaf2ff;
  }
  html{height:100%;-webkit-text-size-adjust:100%;}
  body{
    font-family:'Poppins',system-ui,-apple-system,sans-serif;
    background:#060e1c;
    background-image:
      radial-gradient(900px 700px at 12% 5%, rgba(77,159,255,.28), transparent 62%),
      radial-gradient(800px 800px at 88% 15%, rgba(125,211,252,.18), transparent 62%),
      radial-gradient(900px 800px at 50% 115%, rgba(77,159,255,.22), transparent 62%),
      linear-gradient(165deg,#060e1c 0%,#0a1628 40%,#0f1e3d 70%,#132a52 100%);
    color:#fff;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 14px 34px;
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(34px + env(safe-area-inset-bottom));
    padding-left:calc(14px + env(safe-area-inset-left));
    padding-right:calc(14px + env(safe-area-inset-right));
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background:radial-gradient(600px 400px at 50% 50%, rgba(77,159,255,.08), transparent 70%);
    pointer-events:none;
    z-index:0;
    animation:auroraMove 18s ease-in-out infinite alternate;
  }
  @keyframes auroraMove{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(3%,-3%) scale(1.08);}
  }

  /* estrelinhas/corações flutuando */
  #hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
  .heart{
    position:absolute;bottom:-12%;color:var(--azul-claro);
    animation-name:rise;animation-timing-function:linear;
    animation-iteration-count:infinite;user-select:none;filter:blur(.4px);
  }
  @keyframes rise{
    0%{transform:translateY(0) rotate(0deg) scale(1);}
    50%{transform:translateY(-60vh) rotate(18deg) scale(1.1);}
    100%{transform:translateY(-128vh) rotate(-12deg) scale(.9);}
  }

  .app{
    position:relative;z-index:2;width:100%;max-width:680px;
    display:flex;flex-direction:column;gap:20px;
  }

  header{text-align:center;padding:0 4px;}
  .badge{
    display:inline-block;font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--azul-suave);
    border:1px solid rgba(122,184,255,.4);
    background:rgba(77,159,255,.1);
    padding:7px 16px;border-radius:100px;margin-bottom:16px;
    font-weight:500;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    box-shadow:0 4px 24px -8px rgba(77,159,255,.6);
  }
  h1{
    font-family:'Playfair Display',serif;
    font-size:clamp(26px,7.5vw,44px);
    line-height:1.15;font-weight:700;letter-spacing:-.015em;
    background:linear-gradient(115deg,#fff 15%,var(--azul-suave) 55%,var(--azul-claro) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 4px 30px rgba(77,159,255,.45));
  }
  .sub{
    margin-top:12px;font-size:13.5px;font-weight:300;
    color:rgba(234,242,255,.7);line-height:1.6;
    max-width:400px;margin-left:auto;margin-right:auto;
  }

  /* chips — rolagem horizontal em telas muito pequenas */
  .chips-wrap{
    position:relative;
    margin:0 -14px;
    padding:0 14px;
  }
  .chips-wrap::after{
    content:'';position:absolute;top:0;right:0;bottom:0;width:32px;
    background:linear-gradient(to left,rgba(6,14,28,.85),transparent);
    pointer-events:none;opacity:0;transition:opacity .3s;
  }
  .chips-wrap.scrollable::after{opacity:1;}
  .chips{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  }
  @media (max-width:600px){
    .chips{
      flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
      scrollbar-width:none;-ms-overflow-style:none;
      padding-bottom:6px;padding-top:2px;
    }
    .chips::-webkit-scrollbar{display:none;}
  }
  .chip{
    font-family:inherit;font-size:12.5px;font-weight:400;
    color:rgba(234,242,255,.85);
    background:rgba(122,184,255,.07);
    border:1px solid rgba(122,184,255,.18);
    padding:9px 15px;border-radius:100px;cursor:pointer;
    transition:all .25s cubic-bezier(.2,.8,.3,1);
    white-space:nowrap;position:relative;overflow:hidden;
    flex-shrink:0;min-height:38px;
    display:inline-flex;align-items:center;
    -webkit-user-select:none;user-select:none;
  }
  .chip::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,transparent,rgba(122,184,255,.25),transparent);
    transform:translateX(-100%);transition:transform .6s;
  }
  .chip:hover::before,.chip:active::before{transform:translateX(100%);}
  .chip:hover{
    background:rgba(122,184,255,.15);
    border-color:rgba(122,184,255,.5);color:#fff;
    box-shadow:0 8px 22px -10px rgba(77,159,255,.8);
  }
  .chip:active{transform:scale(.96);}
  .chip.active{
    background:linear-gradient(135deg,#4d9fff,#7ab8ff);
    border-color:transparent;color:#fff;font-weight:500;
    box-shadow:0 10px 30px -10px rgba(77,159,255,1);
  }

  /* card principal */
  .card{
    position:relative;
    background:rgba(122,184,255,.06);
    border:1px solid rgba(122,184,255,.16);
    border-radius:26px;
    padding:34px 22px 24px;
    backdrop-filter:blur(22px) saturate(1.3);
    -webkit-backdrop-filter:blur(22px) saturate(1.3);
    box-shadow:
      0 40px 90px -40px rgba(0,0,0,.9),
      0 0 60px -30px rgba(77,159,255,.4),
      0 0 0 1px rgba(122,184,255,.05) inset,
      inset 0 1px 0 rgba(122,184,255,.15);
    overflow:hidden;
  }
  @media (min-width:640px){
    .card{padding:42px 34px 30px;border-radius:32px;}
  }
  .card::before{
    content:'❝';
    position:absolute;top:2px;left:18px;
    font-family:'Playfair Display',serif;
    font-size:64px;color:rgba(122,184,255,.22);
    line-height:1;pointer-events:none;
  }
  @media (min-width:640px){
    .card::before{font-size:84px;top:4px;left:24px;}
  }
  .card::after{
    content:'';position:absolute;top:-50%;right:-30%;
    width:70%;height:180%;
    background:radial-gradient(circle,rgba(77,159,255,.15),transparent 65%);
    pointer-events:none;animation:auroraMove 12s ease-in-out infinite alternate;
  }
  .msg{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(18px,4.8vw,22px);
    line-height:1.7;font-weight:500;color:var(--branco-azulado);
    text-align:left;min-height:180px;
    position:relative;z-index:1;letter-spacing:.005em;
    word-wrap:break-word;overflow-wrap:break-word;
  }
  .msg.pop{animation:pop .55s cubic-bezier(.2,.8,.3,1);}
  @keyframes pop{
    from{opacity:0;transform:translateY(14px) scale(.985);filter:blur(6px);}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }

  .actions{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;
    position:relative;z-index:1;
  }
  .btn{
    font-family:inherit;font-size:13px;font-weight:500;
    padding:12px 16px;border-radius:100px;
    border:1px solid rgba(122,184,255,.22);
    background:rgba(122,184,255,.08);
    color:rgba(234,242,255,.92);
    cursor:pointer;transition:all .22s cubic-bezier(.2,.8,.3,1);
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    min-height:44px;flex:1 1 auto;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  @media (min-width:640px){
    .btn{flex:0 0 auto;font-size:13.5px;padding:13px 20px;}
  }
  .btn:hover{
    background:rgba(122,184,255,.16);
    border-color:rgba(122,184,255,.4);
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{
    background:linear-gradient(135deg,#4d9fff,#7ab8ff);
    border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 14px 38px -14px rgba(77,159,255,1);
    flex:1 0 100%;order:-1;
    position:relative;overflow:hidden;
  }
  @media (min-width:640px){
    .btn.primary{flex:1;order:0;min-width:180px;}
  }
  .btn.primary::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
    transform:translateX(-120%);transition:transform .6s;
  }
  .btn.primary:hover::before,.btn.primary:active::before{transform:translateX(120%);}

  .btn.motivo{
    background:linear-gradient(135deg,rgba(125,211,252,.35),rgba(77,159,255,.35));
    border-color:rgba(122,184,255,.45);color:#fff;font-weight:500;
    box-shadow:0 10px 26px -12px rgba(125,211,252,.9);
    flex:1 0 100%;order:-1;
  }
  @media (min-width:640px){
    .btn.motivo{flex:0 0 auto;order:0;}
  }
  .btn.motivo:hover{
    background:linear-gradient(135deg,rgba(125,211,252,.55),rgba(77,159,255,.55));
  }

  .counter{
    text-align:center;font-size:12px;font-weight:300;
    color:rgba(199,222,255,.55);line-height:1.7;
    letter-spacing:.01em;padding:0 8px;
  }
  .counter strong{color:var(--azul-claro);font-weight:600;}
  .counter .heart-mini{color:var(--ciano);}

  .assinatura{
    text-align:center;font-family:'Cormorant Garamond',serif;
    font-style:italic;font-size:14.5px;
    color:rgba(122,184,255,.75);margin-top:-6px;letter-spacing:.02em;
  }

  /* corações de explosão */
  .burst{position:fixed;pointer-events:none;z-index:99;animation:burst 1.25s ease-out forwards;}
  @keyframes burst{
    0%{opacity:1;transform:translate(0,0) scale(.4);}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(var(--rot));}
  }
  .hug{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:98;
    font-size:min(62vw,320px);opacity:0;
    animation:hug 1.7s ease-out forwards;
    filter:drop-shadow(0 0 80px rgba(77,159,255,1));
  }
  @keyframes hug{
    0%{opacity:0;transform:scale(.3);}
    22%{opacity:1;transform:scale(1.1);}
    70%{opacity:1;transform:scale(1);}
    100%{opacity:0;transform:scale(1.4);}
  }

  /* ===== OVERLAY RESPIRAÇÃO ===== */
  .respira{
    position:fixed;inset:0;z-index:200;
    background:radial-gradient(circle at 50% 50%,#0a1830 0%,#03060e 100%);
    display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:30px;padding:30px 24px;
    padding-top:calc(30px + env(safe-area-inset-top));
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
    opacity:0;transition:opacity .5s;
  }
  .respira.on{display:flex;opacity:1;}
  .respira-circulo{
    width:min(64vw,240px);height:min(64vw,240px);
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%,rgba(122,184,255,.7),rgba(77,159,255,.3) 60%,rgba(125,211,252,.2));
    border:1.5px solid rgba(199,222,255,.55);
    box-shadow:0 0 80px rgba(77,159,255,.7),inset 0 0 60px rgba(77,159,255,.35);
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-size:19px;color:#fff;
    transition:transform 4s cubic-bezier(.4,0,.4,1), box-shadow 4s;
    flex-shrink:0;
  }
  .respira-circulo.inspira{
    transform:scale(1.32);
    box-shadow:0 0 120px rgba(122,184,255,.95),inset 0 0 80px rgba(122,184,255,.5);
  }
  .respira-circulo.expira{
    transform:scale(.9);
    box-shadow:0 0 50px rgba(125,211,252,.6),inset 0 0 40px rgba(125,211,252,.4);
  }
  .respira-txt{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(19px,5vw,25px);
    color:var(--azul-suave);font-style:italic;
    text-align:center;min-height:36px;max-width:400px;
    padding:0 8px;
  }
  .respira-fechar{
    font-family:inherit;font-size:13.5px;font-weight:500;
    padding:14px 28px;border-radius:100px;
    border:1px solid rgba(122,184,255,.35);
    background:rgba(122,184,255,.12);
    color:#fff;cursor:pointer;transition:.25s;
    min-height:48px;touch-action:manipulation;
  }
  .respira-fechar:hover,.respira-fechar:active{
    background:rgba(122,184,255,.25);
  }

  /* ===== OVERLAY MOTIVOS ===== */
  .motivos{
    position:fixed;inset:0;z-index:210;
    background:
      radial-gradient(1000px 700px at 50% 50%,rgba(77,159,255,.2),transparent 70%),
      radial-gradient(circle at 50% 50%,#0a1830 0%,#03060e 100%);
    display:none;align-items:center;justify-content:center;
    padding:20px 14px;
    padding-top:calc(20px + env(safe-area-inset-top));
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    opacity:0;transition:opacity .4s;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .motivos.on{display:flex;opacity:1;}
  .motivos-card{
    position:relative;width:100%;max-width:560px;
    background:rgba(122,184,255,.07);
    border:1px solid rgba(122,184,255,.25);
    border-radius:28px;
    padding:38px 22px 28px;
    backdrop-filter:blur(24px) saturate(1.4);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);
    box-shadow:
      0 50px 110px -40px rgba(0,0,0,.95),
      0 0 100px -20px rgba(77,159,255,.5),
      inset 0 1px 0 rgba(122,184,255,.18);
    text-align:center;
    animation:motivosIn .55s cubic-bezier(.2,.8,.3,1);
    overflow:hidden;
    margin:auto;
  }
  @media (min-width:640px){
    .motivos-card{padding:46px 34px 34px;border-radius:36px;}
  }
  @keyframes motivosIn{
    from{opacity:0;transform:translateY(24px) scale(.96);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  .motivos-card::before{
    content:'';position:absolute;top:-30%;left:-20%;
    width:140%;height:80%;
    background:radial-gradient(circle,rgba(122,184,255,.22),transparent 65%);
    pointer-events:none;animation:auroraMove 8s ease-in-out infinite alternate;
  }
  .motivos-icon{
    font-size:48px;line-height:1;
    filter:drop-shadow(0 0 30px rgba(77,159,255,1));
    animation:heartbeat 1.6s ease-in-out infinite;
    margin-bottom:12px;position:relative;z-index:1;
  }
  @media (min-width:640px){.motivos-icon{font-size:56px;}}
  @keyframes heartbeat{
    0%,100%{transform:scale(1);}
    20%{transform:scale(1.15);}
    40%{transform:scale(.98);}
    60%{transform:scale(1.1);}
  }
  .motivos-label{
    font-family:'Poppins',sans-serif;font-size:10.5px;
    letter-spacing:.22em;text-transform:uppercase;
    color:rgba(199,222,255,.8);font-weight:500;
    margin-bottom:20px;position:relative;z-index:1;
  }
  .motivos-txt{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(19px,5vw,25px);
    line-height:1.6;font-weight:500;color:#fff;
    margin-bottom:18px;position:relative;z-index:1;
    min-height:140px;display:flex;align-items:center;justify-content:center;
    padding:0 4px;word-wrap:break-word;overflow-wrap:break-word;
  }
  @media (min-width:640px){
    .motivos-txt{min-height:160px;font-size:clamp(20px,3.5vw,26px);}
  }
  .motivos-txt.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1);}
  .motivos-counter{
    font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:300;
    color:rgba(199,222,255,.5);letter-spacing:.04em;
    margin-bottom:22px;position:relative;z-index:1;
  }
  .motivos-counter strong{color:var(--azul-claro);font-weight:600;}
  .motivos-actions{
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    position:relative;z-index:1;
  }
  .motivos-actions .btn{
    font-size:13px;padding:13px 20px;min-height:46px;
    flex:1 0 100%;
  }
  @media (min-width:520px){
    .motivos-actions .btn{flex:1 1 auto;}
  }
  .motivos-actions .btn.primary{
    background:linear-gradient(135deg,#4d9fff,#7ab8ff);
    border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 14px 38px -14px rgba(77,159,255,1);
    flex:1 1 auto;
  }

  /* telas muito pequenas */
  @media (max-width:360px){
    .chip{font-size:11.5px;padding:8px 12px;min-height:34px;}
    .btn{font-size:12px;padding:11px 14px;min-height:42px;}
    .msg{font-size:17px;min-height:200px;}
    .card{padding:30px 18px 22px;}
  }

  /* telas grandes mantêm o layout original */
  @media (min-width:640px){
    body{padding:30px 16px 50px;}
    .app{gap:24px;}
    .chips{flex-wrap:wrap;justify-content:center;}
    .card{border-radius:32px;}
    .msg{min-height:180px;font-size:clamp(19px,2.5vw,22px);}
  }

  /* landscape em celular */
  @media (max-height:500px) and (orientation:landscape){
    body{padding:14px 14px 20px;align-items:flex-start;}
    .respira{gap:18px;}
    .respira-circulo{width:min(30vh,140px);height:min(30vh,140px);font-size:16px;}
    .respira-txt{font-size:17px;}
    .motivos-card{padding:24px 18px 18px;}
    .motivos-txt{min-height:80px;font-size:18px;}
  }
</style>
</head>
<body>

<div id="hearts"></div>

<main class="app">
  <header>
    <div class="badge">feito com amor, só pra você</div>
    <h1>Quando você precisar de mim</h1>
    <p class="sub">Escolhe como você está agora<br>e eu falo com você 💙</p>
  </header>

  <div class="chips-wrap" id="chipsWrap">
    <div class="chips" id="chips"></div>
  </div>

  <section class="card">
    <p class="msg" id="msg"></p>
    <div class="actions">
      <button class="btn primary" id="again">Outra mensagem 💌</button>
      <button class="btn motivo" id="btnMotivo">💙 Por que eu te amo</button>
      <button class="btn" id="copy">📋 Copiar</button>
      <button class="btn" id="zap">💬 WhatsApp</button>
      <button class="btn" id="abraco">🫂 Me abraça</button>
    </div>
  </section>

  <p class="assinatura">— com todo o meu amor, do seu amor</p>

  <p class="counter" id="counter"></p>
</main>

<!-- overlay de respiração -->
<div class="respira" id="respiraOverlay">
  <div class="respira-circulo" id="respiraCirculo">respira</div>
  <div class="respira-txt" id="respiraTxt">Vem cá. Respira comigo…</div>
  <button class="respira-fechar" id="respiraFechar">Já estou melhor 💙</button>
</div>

<!-- overlay de motivos -->
<div class="motivos" id="motivosOverlay">
  <div class="motivos-card">
    <div class="motivos-icon">💙</div>
    <div class="motivos-label">um dos milhares de motivos</div>
    <p class="motivos-txt" id="motivosTxt"></p>
    <div class="motivos-counter" id="motivosCounter"></div>
    <div class="motivos-actions">
      <button class="btn primary" id="motivosProximo">Outro motivo 💙</button>
      <button class="btn" id="motivosFechar">Fechar 🤍</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   1) BANCOS DE FRASES
   ========================================================= */
const SAUDACOES = [
  "Oi, meu amor.","Oi, minha princesa.","Oi, meu bem.","Minha vida,","Amor,",
  "Oi, linda.","Meu anjo,","Oi, meu amorzinho.","Oi, minha gatinha.","Meu bem,",
  "Oi, meu tudo.","Minha princesa,","Oi, meu coração.","Oi, minha vida.","Meu amor,",
  "Oi, meu docinho.","Minha linda,","Oi, meu tesouro.","Oi, meu cheirinho.","Oi, minha paz.",
  "Oi, meu benzinho.","Minha pessoa favorita,","Oi, dona do meu coração.","Oi, minha bebê.",
  "Oi, meu xodó.","Amor da minha vida,","Oi, meu pedacinho de céu.","Minha razão,",
  "Oi, meu sonho.","Oi, minha boneca."
];

  "e isso é o que me faz mais feliz",
  "e nada nesse mundo se compara",
  "e eu agradeço todos os dias por você existir",
  "e isso é tudo o que eu preciso",
  "de um jeito que eu não sei explicar",
  "e é isso que me faz te amar cada vez mais"
];

const TOTAL_MOTIVOS = PREFIXOS_MOTIVOS.length * RAZOES_MOTIVOS.length * COMPLEMENTOS_MOTIVOS.length;

/* =========================================================
   3) CATEGORIAS
   ========================================================= */
const CATEGORIAS = [
  {id:"aleatorio",  label:"Aleatório 🎲"},
  {id:"acalma",     label:"Me acalma 🫧"},
  {id:"triste",     label:"Triste 😢"},
  {id:"saudade",    label:"Saudade 🥺"},
  {id:"ansiosa",    label:"Ansiosa 😰"},
  {id:"cansada",    label:"Cansada 😴"},
  {id:"brava",      label:"Brava 😠"},
  {id:"insegura",   label:"Insegura 😔"},
  {id:"ciumenta",   label:"Ciumenta 😾"},
  {id:"medo",       label:"Com medo 😨"},
  {id:"doente",     label:"Doente 🤒"},
  {id:"estresse",   label:"Estressada 😤"},
  {id:"tpm",        label:"TPM 🌸"},
  {id:"sozinha",    label:"Sozinha 🥀"},
  {id:"noite",      label:"Não durmo 🌙"},
  {id:"fome",       label:"Com fome 🍕"},
  {id:"feia",       label:"Me achando feia 🥲"},
  {id:"arrependida",label:"Arrependida 🥺"},
  {id:"animada",    label:"Animada ✨"},
  {id:"carinho",    label:"Quero carinho 🤍"},
  {id:"amor",       label:"Quero amor 💙"},
  {id:"geral",      label:"Só porque sim ✨"}
];

/* =========================================================
   4) MOTOR
   ========================================================= */
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];

function poolDaCategoria(cat){
  if(!cat || cat === "aleatorio") return SITUACOES;
  const p = SITUACOES.filter(s => s.c === cat);
  return p.length ? p : SITUACOES;
}

function gerarMensagem(categoria){
  const pool = poolDaCategoria(categoria);
  const saudacao = rnd(SAUDACOES);
  const situacao = rnd(pool).t;
  const apoio    = rnd(APOIOS);
  const amor     = rnd(AMORES);
  const fecho    = rnd(FECHOS);
  return `${saudacao} ${situacao} ${apoio} ${amor} ${fecho}`;
}

function gerarMotivo(){
  return `${rnd(PREFIXOS_MOTIVOS)} ${rnd(RAZOES_MOTIVOS)} ${rnd(COMPLEMENTOS_MOTIVOS)}.`;
}

/* =========================================================
   5) INTERFACE
   ========================================================= */
const msgEl       = document.getElementById('msg');
const chipsEl     = document.getElementById('chips');
const chipsWrap   = document.getElementById('chipsWrap');
const counterEl   = document.getElementById('counter');
let categoriaAtual = "aleatorio";
let mensagemAtual  = "";

CATEGORIAS.forEach(cat => {
  const b = document.createElement('button');
  b.className = 'chip' + (cat.id === 'aleatorio' ? ' active' : '');
  b.textContent = cat.label;
  b.dataset.id = cat.id;
  b.addEventListener('click', () => {
    categoriaAtual = cat.id;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    b.classList.add('active');
    mostrar();
    if(cat.id === "acalma") abrirRespira();
  });
  chipsEl.appendChild(b);
});

/* detecta se a barra de chips precisa de fade na borda (só mobile) */
function atualizarFadeChips(){
  if(chipsEl.scrollWidth > chipsEl.clientWidth + 4){
    chipsWrap.classList.add('scrollable');
  } else {
    chipsWrap.classList.remove('scrollable');
  }
}
window.addEventListener('resize', atualizarFadeChips);
chipsEl.addEventListener('scroll', () => {
  const fim = chipsEl.scrollLeft + chipsEl.clientWidth >= chipsEl.scrollWidth - 4;
  chipsWrap.classList.toggle('scrollable', !fim);
});
setTimeout(atualizarFadeChips, 100);

function mostrar(){
  mensagemAtual = gerarMensagem(categoriaAtual);
  msgEl.textContent = mensagemAtual;
  msgEl.classList.remove('pop');
  void msgEl.offsetWidth;
  msgEl.classList.add('pop');
  atualizarContador();
}

function atualizarContador(){
  const total = SAUDACOES.length * SITUACOES.length * APOIOS.length * AMORES.length * FECHOS.length;
  const pool  = poolDaCategoria(categoriaAtual).length;
  const sub   = SAUDACOES.length * pool * APOIOS.length * AMORES.length * FECHOS.length;
  counterEl.innerHTML =
    `💙 <strong>${total.toLocaleString('pt-BR')}</strong> mensagens no total — ` +
    `e <strong>${sub.toLocaleString('pt-BR')}</strong> só pra esse sentimento.<br>` +
    `Mais <strong>${TOTAL_MOTIVOS.toLocaleString('pt-BR')}</strong> motivos do porquê eu te amo.`;
}

/* botões */
document.getElementById('again').addEventListener('click', mostrar);

document.getElementById('copy').addEventListener('click', async (e) => {
  const b = e.currentTarget;
  const original = b.innerHTML;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(mensagemAtual);
    } else {
      // fallback pra navegadores antigos no mobile
      const ta = document.createElement('textarea');
      ta.value = mensagemAtual;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    b.innerHTML = "✅ Copiado!";
    setTimeout(() => b.innerHTML = original, 1600);
  }catch(err){
    alert("Não consegui copiar 😅 Mas é só selecionar o texto e copiar!");
  }
});

document.getElementById('zap').addEventListener('click', () => {
  window.open("https://wa.me/?text=" + encodeURIComponent(mensagemAtual), "_blank");
});

document.getElementById('abraco').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top + rect.height / 2;

  const hug = document.createElement('div');
  hug.className = 'hug';
  hug.textContent = '💙';
  document.body.appendChild(hug);
  setTimeout(() => hug.remove(), 1700);

  for(let i = 0; i < 26; i++){
    const s = document.createElement('span');
    s.className = 'burst';
    s.textContent = ['💙','💎','✨','🤍','💠','🌊','⭐'][Math.floor(Math.random()*7)];
    s.style.left = x + 'px';
    s.style.top  = y + 'px';
    const ang = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 240;
    s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    s.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    s.style.fontSize = (14 + Math.random() * 20) + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
});

/* =========================================================
   6) RESPIRAÇÃO GUIADA
   ========================================================= */
const overlay    = document.getElementById('respiraOverlay');
const circulo    = document.getElementById('respiraCirculo');
const respiraTxt = document.getElementById('respiraTxt');
const fecharBtn  = document.getElementById('respiraFechar');
let respiraTimers = [];
let respiraAtiva  = false;

function limparRespira(){
  respiraTimers.forEach(t => clearTimeout(t));
  respiraTimers = [];
}

function cicloRespira(){
  if(!respiraAtiva) return;
  circulo.classList.remove('expira');
  circulo.classList.add('inspira');
  circulo.textContent = 'inspira';
  respiraTxt.textContent = 'Enche o peito de ar bem devagar…';
  respiraTimers.push(setTimeout(() => {
    if(!respiraAtiva) return;
    circulo.textContent = 'segura';
    respiraTxt.textContent = 'Segura… só mais um pouquinho…';
  }, 4000));
  respiraTimers.push(setTimeout(() => {
    if(!respiraAtiva) return;
    circulo.classList.remove('inspira');
    circulo.classList.add('expira');
    circulo.textContent = 'expira';
    respiraTxt.textContent = 'Solta todo o ar… solta o peso junto…';
  }, 7000));
  respiraTimers.push(setTimeout(cicloRespira, 11000));
}

function abrirRespira(){
  respiraAtiva = true;
  overlay.classList.add('on');
  document.body.style.overflow = 'hidden';
  circulo.classList.remove('inspira','expira');
  respiraTxt.textContent = 'Vem cá. Respira comigo…';
  circulo.textContent = 'respira';
  limparRespira();
  respiraTimers.push(setTimeout(cicloRespira, 800));
}

function fecharRespira(){
  respiraAtiva = false;
  overlay.classList.remove('on');
  document.body.style.overflow = '';
  limparRespira();
  circulo.classList.remove('inspira','expira');
}

fecharBtn.addEventListener('click', fecharRespira);

/* =========================================================
   7) MOTIVOS
   ========================================================= */
const motivosOverlay = document.getElementById('motivosOverlay');
const motivosTxt     = document.getElementById('motivosTxt');
const motivosCounter = document.getElementById('motivosCounter');
const motivosProximo = document.getElementById('motivosProximo');
const motivosFechar  = document.getElementById('motivosFechar');
const btnMotivo      = document.getElementById('btnMotivo');

let numeroMotivo = 0;

function mostrarMotivo(){
  numeroMotivo++;
  motivosTxt.textContent = gerarMotivo();
  motivosTxt.classList.remove('pop');
  void motivosTxt.offsetWidth;
  motivosTxt.classList.add('pop');
  motivosCounter.innerHTML =
    `motivo <strong>nº ${numeroMotivo.toLocaleString('pt-BR')}</strong> — ` +
    `de <strong>${TOTAL_MOTIVOS.toLocaleString('pt-BR')}</strong> possíveis 💙`;
}

function abrirMotivos(){
  motivosOverlay.classList.add('on');
  document.body.style.overflow = 'hidden';
  numeroMotivo = 0;
  mostrarMotivo();
}

function fecharMotivos(){
  motivosOverlay.classList.remove('on');
  document.body.style.overflow = '';
}

btnMotivo.addEventListener('click', abrirMotivos);
motivosProximo.addEventListener('click', mostrarMotivo);
motivosFechar.addEventListener('click', fecharMotivos);
motivosOverlay.addEventListener('click', (e) => {
  if(e.target === motivosOverlay) fecharMotivos();
});

/* fechar overlays com ESC (desktop) */
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    if(motivosOverlay.classList.contains('on')) fecharMotivos();
    if(overlay.classList.contains('on')) fecharRespira();
  }
});

/* =========================================================
   8) FUNDO + PRIMEIRA MENSAGEM
   ========================================================= */
(function criarCoracoes(){
  const wrap = document.getElementById('hearts');
  const simbolos = ['♥','♡','💙','✦','✧','❄'];
  const qtd = window.innerWidth < 500 ? 16 : 24;
  for(let i = 0; i < qtd; i++){
    const s = document.createElement('span');
    s.className = 'heart';
    s.textContent = simbolos[Math.floor(Math.random()*simbolos.length)];
    s.style.left = Math.random() * 100 + '%';
    s.style.fontSize = (9 + Math.random() * 22) + 'px';
    s.style.animationDuration = (11 + Math.random() * 16) + 's';
    s.style.animationDelay = (-Math.random() * 26) + 's';
    s.style.opacity = (0.06 + Math.random() * 0.18).toFixed(2);
    wrap.appendChild(s);
  }
})();

mostrar();
</script>
</body>
</html>
